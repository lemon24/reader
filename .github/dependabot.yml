version: 2

updates:

- package-ecosystem: pip
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  ignore:
  - dependency-name: mypy
    versions:
    - "0.800"
  cooldown:
    default-days: 7

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
