version: 2

updates:

- package-ecosystem: pip
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  groups:
  all-dependencies:
    patterns:
      - "*"
  cooldown:
    default-days: 7

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  groups:
  all-dependencies:
    patterns:
      - "*"
  cooldown:
    default-days: 7
